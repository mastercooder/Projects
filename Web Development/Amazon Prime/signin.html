<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <link rel="stylesheet" href="/assets/signin.css">
</head>
<body>
    <div class="sign_imgcontainer">
        <div class="primeimg"></div>
    </div>
    <div class="sign_txtcontainer">
        <div class="txt_box">
            <p id="txtbox-heading">Sign in</p>
            <p id="input_notxt">Enter mobile number or email</p>
            <input type="signin">
            <div class="txtbox-continue">
                <p>Continue</p>
            </div>
            <div class="txtbox-agriment">
                <span id="txtagr-1">By continuing, you agree to the Amazon </span><span id="txtagr-2">Conditions of Use and Privacy Notice.</span>
            </div>
            <div class="txtbox-needhelp">
                <p>Need help?</p>
                <div class="txneedh-img">
                    <div class="needdrop-img">
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="createacc-heading">
        <div class="cracc-container">
            <div class="cracc1"></div>
            <div class="cracc2">
                <p>New to Amazon?</p>
            </div>
            <div class="cracc1"></div>
        </div>
    </div>
    <div class="createacc-main">
        <div class="cracc-maincon">
            <p>Create your Amazon Account</p>
        </div>
    </div>
    <div id="bottom-line">
        <div class="bottomline-container"></div>
    </div>


    <div class="footer-txt">
        <div class="foot-container">
            <span id="foot-span">Terms and Privacy Notice</span>  <span id="foot-span">Send us feedback</span>  <span id="foot-span">Help</span>
            <p id="foot-p">© 1996-2025, Amazon.com, Inc. or its affiliates</p>
    </div>
</body>
</html>
